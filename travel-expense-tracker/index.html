<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mexico Trip Planner</title>
  <meta name="description" content="Road trip planner and USD/MXN expense, toll and fuel tracker. Works offline." />
  <meta name="theme-color" content="#0f1117" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">

<header class="app-header">
  <div class="header-row">
    <div class="app-title">
      <span class="app-icon" aria-hidden="true">🛣️</span>
      <div>
        <h1 data-i18n="app_title">Mexico Trip Planner</h1>
        <div class="net-status" id="net-status"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="chip rate-chip" id="rate-chip" data-act="openRate" aria-label="Exchange rate">
        <span>1 USD = <b id="rate-display">—</b> MXN</span>
      </button>
      <button class="chip" id="lang-chip" data-act="toggleLang" aria-label="Language">ES</button>
      <button class="chip" id="theme-chip" data-act="toggleTheme" aria-label="Theme">☀️</button>
    </div>
  </div>
</header>

<main id="view" class="container" tabindex="-1"></main>

<nav class="bottom-nav" id="bottom-nav" aria-label="Main">
  <button data-nav="today"><span class="ni">📍</span><span class="nl" data-i18n="nav_today">Today</span></button>
  <button data-nav="plan"><span class="ni">🗺️</span><span class="nl" data-i18n="nav_plan">Plan</span></button>
  <button data-nav="spend"><span class="ni">💵</span><span class="nl" data-i18n="nav_spend">Spend</span></button>
  <button data-nav="tolls"><span class="ni">🛣️</span><span class="nl" data-i18n="nav_tolls">Tolls</span></button>
  <button data-nav="fuel"><span class="ni">⛽</span><span class="nl" data-i18n="nav_fuel">Fuel</span></button>
  <button data-nav="more"><span class="ni">☰</span><span class="nl" data-i18n="nav_more">More</span></button>
</nav>

<div class="modal-overlay" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" id="modal-body"></div>
</div>

<div id="toast-container" aria-live="polite"></div>

<noscript>This app needs JavaScript.</noscript>

<script src="vendor/suncalc.js"></script>
<script src="i18n.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
